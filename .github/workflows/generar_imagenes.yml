name: Generar imágenes

on:
  workflow_dispatch:

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Descargar historia_generada.json de la ejecución anterior
        uses: actions/download-artifact@v4
        with:
          name: historia_generada
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.run_id }}
        continue-on-error: true

      - name: Generar las imágenes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generar_imagenes.py

      - name: Guardar imágenes como descarga
        uses: actions/upload-artifact@v4
        with:
          name: imagenes_generadas
          path: imagenes/
